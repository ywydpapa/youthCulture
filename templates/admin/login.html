<!DOCTYPE html>
<html lang="ko">
{% include '/common/header.html' %}
<body>
    <div class="container mt-2">
        {% include '/common/top_bar.html' %}
        {% include '/common/topmenu.html' %}

        <div class="section-title-wrapper">
            <div class="section-title-line"></div>
            <div class="section-title-text">ADMIN LOGIN</div>
            <div class="section-title-line"></div>
        </div>

        <div class="row justify-content-center my-5">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex p-3 rounded-circle bg-light text-primary mb-2">
                                <i class="bi bi-shield-lock fs-1"></i>
                            </div>
                            <h4 class="fw-bold text-dark">관리자 로그인</h4>
                            <p class="text-muted small">IYCF 사이트 관리자 전용 인증 페이지입니다.</p>
                        </div>

                        {% if error %}
                        <div class="alert alert-danger py-2 px-3 small d-flex align-items-center" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <div>{{ error }}</div>
                        </div>
                        {% endif %}

                        <form method="POST" action="/admin/login">
                            <div class="mb-3">
                                <label for="username" class="form-label small fw-semibold">아이디</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="관리자 아이디 입력">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label small fw-semibold">비밀번호</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-key text-muted"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" required placeholder="비밀번호 입력">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" style="background-color: #2b6a9c; border-color: #2b6a9c;">
                                로그인
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    {% include '/common/footer.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
